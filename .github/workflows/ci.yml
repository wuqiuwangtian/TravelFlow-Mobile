name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android-probe:
    name: Contract, domain and Android (${{ matrix.target }}, ${{ matrix.transport }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: emulator
            transport: platform
          - target: usb
            transport: platform
          - target: emulator
            transport: okhttp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check:contracts
      - run: pnpm check:ledger
      - run: pnpm typecheck
      - name: Check probe script syntax (native interaction requires an isolated emulator)
        run: |
          node --check prototypes/android-runtime/probe.js
          node --check prototypes/android-runtime/bootstrap.js
          node --check scripts/check-android-stream.mjs
          node --check scripts/check-android-tls.mjs
          node --check scripts/check-android-compat.mjs
          node --check scripts/check-android-local.mjs
          node --check scripts/check-android-connect.mjs
          node --check scripts/check-android-async.mjs
          node --check scripts/check-android-dns-codec.mjs
          node --check scripts/check-android-proxy-guard.mjs
          node --check scripts/check-android-network.mjs
          node --check scripts/lib/android-probe-cdp.mjs
          node --check scripts/manage-probe-reverse.mjs
          python -m py_compile scripts/android_probe_service.py scripts/prepare-probe-tls.py scripts/check-probe-apk.py scripts/inspect-android-provider.py scripts/inspect-webview-apk.py scripts/run-android-connect.py scripts/lib/connect_fixture.py scripts/check-dns-codec.py scripts/lib/network_fixture.py
      - run: PYTHONOPTIMIZE=1 python scripts/check-connect-fixture.py
      - run: node scripts/check-probe-reverse.mjs
      - run: pnpm audit --audit-level=moderate
      - name: Prepare independent candidate project
        run: |
          python scripts/prepare-probe-tls.py --output "$RUNNER_TEMP/probe-tls" --target "${{ matrix.target }}" --transport-probe "${{ matrix.transport }}"
          node scripts/prepare-android-probe.mjs --output "$RUNNER_TEMP/android-probe" --tls-fixtures "$RUNNER_TEMP/probe-tls" --target "${{ matrix.target }}" --transport-probe "${{ matrix.transport }}"
      - name: Audit isolated candidate dependencies
        run: pnpm --dir "$RUNNER_TEMP/android-probe" audit --audit-level=moderate
      - name: Ensure Android build packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Build debug and unsigned release APKs (no emulator or publication)
        working-directory: ${{ runner.temp }}/android-probe/android
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --console=plain
      - name: DNS codec loopback protocol and real socket cancellation
        if: matrix.transport == 'okhttp'
        run: |
          (cd "$RUNNER_TEMP/android-probe/android" && ./gradlew :app:exportDnsCodec --no-daemon --console=plain)
          python scripts/check-dns-codec.py --jar "$RUNNER_TEMP/android-probe/android/app/build/probe-deps/minidns-core-1.1.1.jar"
      - name: Full debug lint (includes debug network policy)
        working-directory: ${{ runner.temp }}/android-probe/android
        run: ./gradlew :app:lintDebug --no-daemon --console=plain
      - name: Verify packaged release excludes test CA and cleartext exception
        run: >-
          python scripts/check-probe-apk.py
          --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          --debug "$RUNNER_TEMP/android-probe/android/app/build/outputs/apk/debug/app-debug.apk"
          --release "$RUNNER_TEMP/android-probe/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          --tls-fixtures "$RUNNER_TEMP/probe-tls"
          --target "${{ matrix.target }}"
          --transport-probe "${{ matrix.transport }}"
