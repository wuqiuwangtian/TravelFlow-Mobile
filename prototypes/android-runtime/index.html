<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>TravelFlow Android P0</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <style>
    body { margin: 0; background: var(--tf-background); color: var(--tf-ink); font-family: system-ui, sans-serif; }
    main { max-width: 38rem; margin: auto; padding: max(1rem, env(safe-area-inset-top)) 1rem 2rem; }
    h1 { font-size: 1.5rem; }
    p { line-height: 1.6; overflow-wrap: anywhere; }
    button, select { box-sizing: border-box; max-width: 100%; min-height: 44px; margin: .25rem 0; }
    #error { color: var(--tf-danger); }
  </style>
</head>
<body>
  <main>
    <h1>Android隔离原型</h1>
    <p>虚构记录与测试服务，不是正式账本。未调用模型、地图或个人服务。</p>
    <p id="runtime" role="status">正在检查原生环境…</p>
    <p id="ledger" role="status">本地记录尚未确认</p>
    <button class="tf-button" id="append" disabled>原生保存1.23元</button>
    <button class="tf-button" id="retry" disabled>重放上次操作</button>
    <button class="tf-button" id="http" disabled>调用独立测试服务</button>
    <p id="network" role="status">网络调用尚未验证</p>
    <h2>原生流式传输实验</h2>
    <p>仅访问固定虚构服务。恢复是按事件编号显式重连，不代表业务同步或供应商自动续传。</p>
    <label for="transport">测试传输</label>
    <button class="tf-button" id="credential-prepare" disabled>准备虚构凭据</button>
    <button class="tf-button" id="credential-clear" disabled>移除虚构凭据</button>
    <p id="credential-status" role="status">只测试固定虚构凭据，不接收真实密钥。</p>
    <select id="transport" disabled>
      <option value="http">HTTP回归</option>
      <option value="https">HTTPS有效证书</option>
      <option value="untrusted">HTTPS不受信任证书</option>
      <option value="hostname">HTTPS主机名不匹配</option>
      <option value="expired">HTTPS过期证书</option>
      <option value="handshake">TLS握手停顿</option>
    </select>
    <button class="tf-button" id="stream" disabled>分块输出</button>
    <button class="tf-button" id="stall" disabled>读取超时</button>
    <button class="tf-button" id="drop" disabled>中途断开</button>
    <button class="tf-button" id="resume" disabled>从上次分块恢复</button>
    <button class="tf-button" id="cancel" disabled>取消原生请求</button>
    <button class="tf-button" id="drip" disabled>持续分块与总时限</button>
    <button class="tf-button" id="no-auth" disabled>缺少虚构凭据</button>
    <button class="tf-button" id="unauthorized" disabled>错误虚构凭据</button>
    <button class="tf-button" id="redirect" disabled>拒绝重定向</button>
    <p id="stream-status" role="status">流式传输尚未验证</p>
    <pre id="stream-events" style="white-space: pre-wrap; overflow-wrap: anywhere;"></pre>
    <p id="error" role="alert"></p>
  </main>
  <script src="bootstrap.js"></script>
</body>
</html>
